<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encurtador de Links</title>

    <link rel="stylesheet" href="../static/style.css">
    <link rel="shortcut icon" href="../static/img/icon/chain.ico" type="image/x-icon">
</head>
<body>
    <main>
        <form class="form">
            <h1>Encurtador de Links</h1>

            <div class="input-container">
                <input class="input" type="url" placeholder="Cole seu link aqui..." required>

                <button class="btn" type="submit">
                    <img src="../static/img/arrow-right.png" alt="Encurtar link">
                </button>
            </div>
        </form>
    </main>
</body>
</html>
